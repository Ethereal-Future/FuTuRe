name: Storybook Build

# Verify that Storybook builds successfully on every PR and push to main.
# This catches broken story imports, missing props, and build-time errors
# before they reach the main branch.
on:
  push:
    branches: [main, master, develop]
    paths:
      - "frontend/src/**"
      - "frontend/.storybook/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/storybook.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "frontend/src/**"
      - "frontend/.storybook/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/storybook.yml"

jobs:
  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.3.0
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Storybook
        run: npm run build-storybook
        working-directory: frontend
        env:
          # Storybook needs VITE_ variables at build time; use safe defaults
          VITE_API_URL: http://localhost:3001

      - name: Upload Storybook artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storybook-static
          path: frontend/storybook-static
          retention-days: 7
