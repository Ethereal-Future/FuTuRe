name: Bug Report
description: Report a problem with the FuTuRe platform
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much detail as you can — Stellar-related bugs in particular are hard to reproduce without knowing the network and account state involved.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Submit a payment of '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, including any error messages shown in the UI.
    validations:
      required: true

  - type: dropdown
    id: stellar-network
    attributes:
      label: Stellar network
      description: Which STELLAR_NETWORK was the backend configured for when this occurred?
      options:
        - testnet
        - mainnet
        - futurenet
        - Not applicable
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v20.x.x
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser (if a frontend bug)
      placeholder: Chrome 128, Firefox 130, Safari 17, N/A
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant backend/frontend console output or logs. This is automatically formatted as code, no need for backticks.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to make sure this is not a duplicate
          required: true
        - label: This is not a security vulnerability (if it is, please follow the security disclosure process instead of filing a public issue)
          required: true
